<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Auto Refresh</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="panel">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon">↻</div>
        <div>
          <div class="title">Smart Auto Refresh</div>
          <div class="subtitle">自動重新整理目前分頁</div>
        </div>
      </div>

      <label class="switch" aria-label="開關自動重新整理">
        <input id="enabledToggle" type="checkbox" />
        <span class="slider"></span>
      </label>
    </header>

    <section class="content">
      <div class="section-title">重新整理間隔</div>

      <div class="preset-grid" id="presetGrid">
        <button class="preset" data-seconds="60">1 分鐘</button>
        <button class="preset" data-seconds="120">2 分鐘</button>
        <button class="preset active" data-seconds="300">5 分鐘</button>
        <button class="preset" data-seconds="600">10 分鐘</button>
      </div>

      <div class="custom-area">
        <div class="custom-row">
          <label for="customMinutes">自訂分鐘</label>
          <div class="custom-input-wrap">
            <input id="customMinutes" type="number" min="1" step="1" inputmode="numeric" placeholder="例如 3" />
            <span>分鐘</span>
          </div>
        </div>

        <div class="custom-row seconds-row">
          <label for="customSeconds">自訂秒數</label>
          <div class="custom-input-wrap">
            <input id="customSeconds" type="number" min="1" step="1" inputmode="numeric" placeholder="例如 15" />
            <span>秒</span>
          </div>
        </div>
      </div>

      <div id="statusCard" class="status-card off">
        <span class="status-dot"></span>
        <div>
          <div id="statusText" class="status-text">未啟動</div>
          <div id="statusHint" class="status-hint">預設每 5 分鐘重新整理一次</div>
        </div>
      </div>

      <div id="errorText" class="error" hidden></div>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
